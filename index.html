<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Философия РК и экзамен</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--fg:#1f1d1a;--muted:#6b665d;--line:#e3ded3;--accent:#3d5a80;--ok:#2e7d4f;--okbg:#e6f4ea;--bad:#b3261e;--badbg:#fbe9e7}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161513;--card:#201f1c;--fg:#ece8e1;--muted:#a19b90;--line:#34312c;--accent:#8fb3e0;--ok:#7fd19b;--okbg:#1d3326;--bad:#f2a49c;--badbg:#3a201d}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:24px 16px 60px}
h1{font-size:26px;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg);padding:10px 16px}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--bg);font-weight:600}
button:disabled{opacity:.5;cursor:default}
.bar{height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin:12px 0 18px}
.bar i{display:block;height:100%;background:var(--accent);transition:width .25s}
.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:14px}
.q{font-size:19px;font-weight:600;margin:0 0 16px}
.opts{display:grid;gap:10px}
.opt{text-align:left;padding:12px 14px;display:flex;gap:10px}
.opt b{color:var(--muted);min-width:18px}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.ok{background:var(--okbg);border-color:var(--ok)}
.opt.bad{background:var(--badbg);border-color:var(--bad)}
.opt:disabled{opacity:1}
.feedback{margin-top:14px;font-weight:600}
.feedback.ok{color:var(--ok)}.feedback.bad{color:var(--bad)}
.big{font-size:44px;font-weight:700;margin:4px 0}
.mist{margin-top:18px;display:grid;gap:10px}
.mist div{border-left:3px solid var(--bad);padding:6px 12px;background:var(--bg);border-radius:0 8px 8px 0}
.mist small{color:var(--muted);display:block}
label{display:flex;gap:8px;align-items:center;margin:6px 0}
.hint{color:var(--muted);font-size:13px;margin-top:14px}
.hidden{display:none}
</style>
</head>
<body>
<div class="wrap">
<h1>Философия — РК и экзамен</h1>
<p class="sub">Банк вопросов к РК и экзамену. Варианты перемешиваются при каждом запуске.</p>

<div id="start" class="card">
  <p style="margin-top:0"><b>Режим:</b></p>
  <label><input type="radio" name="mode" value="all" checked> Все вопросы (<span id="total"></span>)</label>
  <label><input type="radio" name="mode" value="30"> Случайные 30</label>
  <label><input type="radio" name="mode" value="50"> Случайные 50</label>
  <label><input type="radio" name="mode" value="order"> Все по порядку, как в списке</label>
  <div class="row" style="margin-top:14px"><button class="primary" id="go">Начать</button></div>
  <p class="hint">Клавиши: 1–5 выбрать ответ, Enter — следующий вопрос.</p>
</div>

<div id="quiz" class="card hidden">
  <div class="meta"><span id="cnt"></span><span id="sc"></span></div>
  <div class="bar"><i id="prog"></i></div>
  <p class="q" id="qt"></p>
  <div class="opts" id="opts"></div>
  <div class="feedback" id="fb"></div>
  <div class="row" style="margin-top:16px;justify-content:space-between">
    <button id="quit">Завершить</button>
    <button class="primary" id="next" disabled>Далее →</button>
  </div>
</div>

<div id="res" class="card hidden">
  <div class="sub" style="margin:0">Результат</div>
  <div class="big" id="pct"></div>
  <div id="sum"></div>
  <div class="row" style="margin-top:16px">
    <button class="primary" id="retryWrong">Повторить ошибки</button>
    <button id="again">В начало</button>
  </div>
  <div class="mist" id="mist"></div>
</div>
</div>

<script>
// [вопрос, правильный ответ, [неправильные]]
const Q=[["Какой из разделов философии изучается формы чувственного познания (ощущения, восприятия, представления), рационального познания (понятия, суждения, умозаключения)?", "Гносеология", ["Логика", "Эмпиризм", "Эпистемология", "Онтология"]], ["Как называется раздел философии, в котором рассматриваются фундаментальные принципы устройства бытия, его начала, сущностные формы, свойства и категориальные распределения?", "Онтология", ["Эпистемология", "Эстетика", "Логика", "Гносеология"]], ["Как называется раздел философии, предметом которого изучения являются методы и способы правильного рассуждения, размышления, а также процесс мышления, которому свойственна закономерность, последовательность, доказательность?", "Логика", ["Онтология", "Гносеология", "Философия", "Эпистемология"]], ["Как называется раздел философии о сущности и сущностной структуре человека, о его основных отношениях: к природе, обществу, другим людям, самому себе, о его происхождении.", "Антропология", ["Онтология", "Логика", "Социальная философия", "Гносеология"]], ["Как называется раздел философии, предметом которого являются теория природы и источников ценностей, способы индивидуального оправдания и осуждения наличного и возможного бытия, назначение человека, его целей и идеалов?", "Аксиология", ["Эстетика", "Эпистемология", "Агностицизм", "Философия науки"]], ["Какая философская наука, предметом которой является изучение морали, нравственности,имеющую систему понятий, описывающих моральные феномены, ситуации?", "Этика", ["Философия культуры", "Эпистемология", "Гносеология", "Эстетика"]], ["Как называется самостоятельная область философского знания, целью которой является изучение качественного своеобразия общества, особенности его развития и перспектив?", "Социальная философия", ["Философия техники", "Аксиология", "Эпистемология", "Праксиология"]], ["Какой из разделов философии изучает природу исторической реальности, процесс возникновения общества, закономерности, факторы исторического процесса, а также особенности и формы самого исторического познания?", "Философия истории", ["Философия техники", "Философия искусства", "История философии", "Социальная философия"]], ["Кто из античных философов своим учением определил «линию материализма» в философии?", "Демокрит", ["Платон", "Пифагор", "Протагор", "Сократ"]], ["Кто из античных философов своим учением определил «линию идеализма» в философии?", "Платон", ["Аристотель", "Гераклит", "Эпикур", "Цицирон"]], ["Как называется совокупность приемов и операций практического и теоретического освоения действительности?", "Метод", ["Эксперимент", "Наука", "Индукция", "Дедукция"]], ["Как называется система взглядов, отвергающих религиозную веру в сверхъестественное (Бога или других высших сил)?", "Атеизм", ["Гуманизм", "Индивидуализм", "Деизм", "Прагматизм"]], ["Как называется способ рассмотрения явлений мира, исходящий из единого начала, единой основы (субстанции) всего существующего?", "Монизм", ["Мироощущение", "Мировоззрение", "Метод", "Монотеизм"]], ["Как называется способ рассмотрения явлений мира, исходящий из признания равноправными, не сводимыми друг другу двух начал духа и материи, идеального и реального?", "Дуализм", ["Диалектика", "Моделирование", "Синтез", "Метафизика"]], ["Как называется направление в философии, сторонники которого признают первичным, исходным дух, сознание, идею?", "Идеализм", ["Метафизика", "Рационализм", "Сознание", "Диалектика"]], ["Какое из философских направлений решает основной ? философии в пользу первичности материи, природы, бытия физического и объективного, рассматривает сознание и мышление как вторичное?", "Материализм", ["Агностицизм", "Эмпиризм", "Идеализм", "Сенсуализм"]], ["Как называется процесс историко-эволюционного формирования физического типа человека, первоначального развития его трудовой деятельности и речи?", "Антропогенез", ["Секуляризация", "Антропоцентризм", "Антропоморфизм", "Развитие"]], ["Как называется тип развития общества, подразумевающую под собой задержку или остановку общественного развития?", "Стагнация", ["Регресс", "Реформа", "Застой", "Научно-технический прогресс"]], ["Как называется в гносеологии источник познавательной, оценочной и практической активности?", "Субъект", ["Знание", "Объект", "Наука", "Истина"]], ["Как называется первобытная форма верования, основанная на вере в сверхъестественную силу неодушевлённых предметов – амулетов, талисманов, оберегов и т.д.?", "Фетишизм", ["Тотемизм", "Миф", "Анимизм", "Магия"]], ["Как называется одна из ранних форм религии первобытного общества, основывавшаяся на совокупности верований, мифов, обрядов и обычаев, связанных с верой в сверхъестественное родство людей с различными предметами, явлениями и существами?", "Тотемизм", ["Антропоморфизм", "Анимизм", "Магия", "Фетишизм"]], ["Как называется одна из ранних форм религии, суть которой заключается в вере в существование души и духов как причины явлений природы, вере в одушевленность всей природы?", "Анимизм", ["Деизм", "Гилозоизм", "Тотемизм", "Пантеизм"]], ["Как называется совокупность верований и обрядов, в основе которой - вера в возможность воздействия на людей, предметы, явления окружающего мира сверхъестественным путем?", "Магия", ["Колдовство", "Анимизм", "Фетишизм", "Тотемизм"]], ["Когда был открыт Казахстанско-Российский Медицинский Университет?", "В 1992 году", ["В 2005 году", "В 1982 году", "В 2002 году", "В 2000 году"]], ["Какая из философских категорий служит обозначения то, на что направлена познавательная деятельность субъекта?", "Объект", ["Знание", "Субъект", "Истина", "Наука"]], ["Какое философское учение признает ощущения единственным и достаточным источником познания?", "Сенсуализм", ["Идеализм", "Скептицизм", "Релятивизм", "Материализм"]], ["Как называется философская позиция, согласно которой существуют несколько или множество независимых и несводимых друг к другу начал или видов бытия, оснований и форм знания?", "Плюрализм", ["Релятивизм", "Скептицизм", "Дуализм", "Политеизм"]], ["Как называется система верований, религиозное мировоззрение, основанное на вере в нескольких божеств, обычно собранных в пантеон из богов и богинь?", "Политеизм", ["Пантеизм", "Плюрализм", "Религия", "Магия"]], ["Как называется самый древний тип мировоззрения, характерный для архаического общества?", "Миф", ["Религия", "Фетишизм", "Анимизм", "Тотемизм"]], ["Какой исторический период охватывает античная философия?", "Период с конца VI в. до н.э. вплоть до VI в. н.э.", ["Период с III в. до н.э.-V в. н.э.", "Период с V в. до н.э.-XII в. н.э.", "Период с конца I в.до н.э. до VII в.", "Период с конца VI в. до н.э. до Х в. н.э."]], ["В каком разделе философии рассматриваются проблемы развития философии в хронологическом порядке, выявляются особенности каждого исторического этапа, преемственность философских учений и идей?", "История философии", ["Эпистемология", "Социальная философия", "Гносеология", "Аксиология"]], ["Как называется философско-методологическая дисциплина, в которой исследуется научное знание, его строение, структура, функционирование и развитие?", "Эпистемология", ["Эклектика", "Провиденциализм", "Эсхатология", "Наукоцентризм"]], ["Как называется форма существования и систематизации результатов познавательной деятельности человека, проверенный практикой результат познания действительности, верное ее отражение в сознании человека, позволяющее достигать намеченных целей?", "Знание", ["Догма", "Истина", "Образование", "Вера"]], ["Какое из приведенных определений соответствует понятию «Ложь»?", "Сознательное искажение истины, призванное ввести кого-либо в заблуждение", ["Способы человеческого самовыражения и самопознания, накопление человеком и социумом в целом навыков и умений.", "Субъективная оценка индивидом самого себя", "Категория философии, обозначающая то, что существует само по себе, не зависит ни от чего другого", "Форма существования и систематизации результатов познавательной деятельности человека"]], ["Кто из древнегреческих философов дал собственную трактовку термину «философия», подразумевая под ним вечное стремление к непостижимой истине?", "Пифагор", ["Платон", "Демокрит", "Анаксимандр", "Протагор"]], ["Каким понятием фиксируется момент ограниченности знания, его несоответствия своему объекту или несовместимости с принятым знанием?", "Заблуждение", ["Синкретизм", "Иррационализм", "Правда", "Ложь"]], ["Как называется процесс получения, хранения, переработки и систематизации осознанных конкретно-чувственных и понятийных образов действительности?", "Познание", ["Труд", "Образование", "Наука", "Практика"]], ["Как называется процесс деятельности, в результате которого создаются качественно новые объекты, духовные ценности или итог создания объективно нового?", "Творчество", ["Образование", "Труд", "Глобализация", "Наука"]], ["Кого в истории философии считают первым, «истинным философом», что именно с него начинается философия, т.к. он первый кто обратил внимание на окружающий мир?", "Фалес", ["Платон", "Аристотель", "Сократ", "Плотин"]], ["Что можно отнести к исходным, простейшим формам чувственного познания?", "Ощущение", ["Опыт", "Психика", "Сознание", "Память"]], ["Какая мировоззренческая позиция характерна для философской картины средневековья Западной Европы и арабо-мусульманской философии ?", "Теоцентризм", ["Космоцентризм", "Антропоцентризм", "Деизм", "Гуманизм"]], ["Как называется философское мировоззрение, в основе которого лежит объяснение окружающего мира, явлений природы через могущество, всесильность, бесконечность внешних сил — Космоса и согласно которому всё сущее зависит от Космоса и космических циклов?", "Космоцентризм", ["Теософия", "Теоцентризм", "Космизм", "Ноосфера"]], ["Как называется творческая деятельность по получению нового знания, результат этой деятельности: совокупность знаний в понятийной форме, приведенных в целостную систему на основе определенных принципов, и процесс их производства?", "Наука", ["Социализация", "Образование", "Искусство", "Интеграция"]], ["Как называется особая форма познания и система знаний об общих характеристиках, понятиях и принципах действительности (бытия), а также о бытии человека и об отношении его и окружающего мира?", "Философия", ["Наука", "Методология", "Разум", "Теософия"]], ["Как называется система взглядов, оценок и образных представлений о мире и месте в нём человека, общее отношение человека к окружающей действительности и самому себе?", "Мировоззрение", ["Наука", "Образование", "Научная картина мира", "Философия"]], ["Что представляет собой «Философская категория для обозначения объективной реальности, которая дана человеку в ощущениях его, которая копируется, фотографируется, отображается нашими ощущениями, существуя независимо от них?", "Материя", ["Апейрон", "Действительность", "Природа", "Первона+чало"]], ["Кто дал определение сущности основного ?а философии как \"…– ? об отношении мышления к бытию, сознания к материи... философы разделились на два больших лагеря, сообразно тому как отвечали на этот ??\"", "Ф.Энгельс", ["Ж.П.Сартр", "Ф.Ницше", "И.Кант", "Р.Декарт"]], ["Как называется человеческая деятельность в её самых разных проявлениях, включая все формы и способы человеческого самовыражения и самопознания, накопление человеком и социумом в целом навыков и умений?", "Культура", ["Философия", "Наука", "Общество", "Образование"]], ["Как называется высшая форма организации научного знания, дающая целостное представление о закономерностях и существенных связях определенной области действительности?", "Теория", ["Гипотеза", "Учение", "Закон", "Наука"]], ["Как называется философская категория, в которой отражена реализованная на практике возможность или возможности, т.е. все то, что объективно существует в мире?", "Действительность", ["Наука", "Практика", "Бытие", "Субстанция"]], ["Какой элемент мировоззрения, придающий личности или социальной группе уверенность в своих взглядах на мир, знаниях и оценках реальной действительности?", "Убеждение", ["Религия", "Образование", "Практика", "Знания"]], ["В какой философ ок по отношению к религии, концептуализаций её природы и функций, а также философских обоснований существования божества, философские рассуждения о его природе и отношении к миру и человеку?", "Философия религии", ["Этика", "Социальная философия", "Антропология", "Эстетика"]], ["Что представляет собой сфера человеческой деятельности, форма общественного сознания, включающая веру в сверхъестественное, соответствующее поведение и специфические действия, особые институты и идеологию?", "Религия", ["Искусство", "Наука", "Мораль", "Право"]], ["Как называется раздел философии, в котором изучаются источники, формы научного познания, способности человека познавать действительность?", "Гносеология (Эпистемология)", ["Онтология", "Аксиология", "Праксиология", "Логика"]], ["Какая из функций философии связана с объяснением общественных процессов, причин их возникновения и эволюции, современного состояния общества, его структуры, элементов, движущих сил и т.д.?", "Социальная", ["Методологическая", "Гносеологическая", "Аксиологическая", "Эвристическая"]], ["Как называется особая область психики, сосредоточившая в себе вечные влечения, мотивы, стремления, смысл которых определяется инстинктами и недоступен сознанию?", "Бессознательное", ["Сверхсознание", "Разум", "Рассудок", "Интуиция"]], ["Чем становится всесторонне проверенная и подтвержденная практикой гипотеза?", "Теорией", ["Проблемой", "Догмой", "Аксиомой", "Парадигмой"]], ["Как называется учение, сторонники которого утверждали, что «практика – критерий истины»?", "Марксизм", ["Позитивизм", "Экзистенциализм", "Схоластика", "Рационализм"]], ["Как называется методологическая концепция в философии, сторонники которой утверждают, что знания относительны, абсолютной истины не существует, то есть все в мире субъективно?", "Релятивизм", ["Догматизм", "Скептицизм", "Эмпиризм", "Агностицизм"]], ["Как английский философ Нового времени Френсис Бэкон называл различные виды когнитивных искажений и заблуждений, которые мешают объективному const $=id=>document.getElementById(id);
$("total").textContent=Q.length;
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
let list=[],i=0,score=0,wrong=[],answered=false,cur=null;
function start(idx){list=idx;i=0;score=0;wrong=[];show("quiz");render()}
function show(id){["start","quiz","res"].forEach(s=>$(s).classList.toggle("hidden",s!==id))}
function render(){
  const q=Q[list[i]];answered=false;
  cur=shuffle([q[1],...q[2]]);
  $("cnt").textContent=`Вопрос ${i+1} из ${list.length}`;
  $("sc").textContent=`Верно: ${score}`;
  $("prog").style.width=(i/list.length*100)+"%";
  $("qt").textContent=q[0];
  $("fb").textContent="";$("fb").className="feedback";
  $("next").disabled=true;
  $("opts").innerHTML="";
  cur.forEach((t,k)=>{const b=document.createElement("button");b.className="opt";
    b.innerHTML=`<b>${k+1}</b><span></span>`;b.lastChild.textContent=t;
    b.onclick=()=>pick(k);$("opts").appendChild(b)});
}
function pick(k){
  if(answered||k>=cur.length)return;answered=true;
  const q=Q[list[i]],btns=[...$("opts").children];
  btns.forEach((b,n)=>{b.disabled=true;if(cur[n]===q[1])b.classList.add("ok")});
  if(cur[k]===q[1]){score++;$("fb").textContent="Верно!";$("fb").classList.add("ok")}
  else{btns[k].classList.add("bad");wrong.push({idx:list[i],chosen:cur[k]});
    $("fb").textContent="Неверно. Правильный ответ: "+q[1];$("fb").classList.add("bad")}
  $("sc").textContent=`Верно: ${score}`;
  $("next").disabled=false;$("next").textContent=i===list.length-1?"Результат":"Далее →";$("next").focus();
}
function next(){if(!answered)return;i++;if(i>=list.length)finish();else render()}
function finish(){
  const total=Math.min(i,list.length)||1;
  show("res");
  $("pct").textContent=Math.round(score/total*100)+"%";
  $("sum").textContent=`Правильно ${score} из ${total}. Ошибок: ${wrong.length}.`;
  $("retryWrong").classList.toggle("hidden",!wrong.length);
  $("mist").innerHTML=wrong.length?"<b>Разбор ошибок:</b>":"<b>Без ошибок — отлично!</b>";
  wrong.forEach(w=>{const d=document.createElement("div");const q=Q[w.idx];
    d.innerHTML="<span></span><small></small><small></small>";
    d.children[0].textContent=q[0];
    d.children[1].textContent="Ваш ответ: "+w.chosen;
    d.children[2].textContent="Правильно: "+q[1];d.children[2].style.color="var(--ok)";
    $("mist").appendChild(d)});
}
$("go").onclick=()=>{const m=document.querySelector("input[name=mode]:checked").value;
  const all=Q.map((_,k)=>k);
  start(m==="order"?all:(m==="30"||m==="50")?shuffle(all).slice(0,+m):shuffle(all))};
$("next").onclick=next;
$("quit").onclick=()=>{if(answered)i++;finish()};
$("again").onclick=()=>show("start");
$("retryWrong").onclick=()=>start(shuffle(wrong.map(w=>w.idx)));
document.addEventListener("keydown",e=>{if($("quiz").classList.contains("hidden"))return;
  if(/^[1-5]$/.test(e.key))pick(+e.key-1);else if(e.key==="Enter"&&answered){e.preventDefault();next()}});
</script>
